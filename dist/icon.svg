<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="50%" style="stop-color:#facc15"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Ground line -->
  <rect x="48" y="380" width="416" height="6" rx="3" fill="#334155"/>

  <!-- Building/Property -->
  <rect x="120" y="150" width="170" height="230" rx="10" fill="url(#bldgGrad)"/>
  <rect x="120" y="150" width="170" height="40" rx="10" fill="#2563eb"/>
  <rect x="120" y="180" width="170" height="10" fill="#1d4ed8"/>

  <!-- Windows -->
  <g fill="#fde047" opacity="0.9">
    <rect x="140" y="210" width="35" height="30" rx="4"/>
    <rect x="190" y="210" width="35" height="30" rx="4"/>
    <rect x="240" y="210" width="35" height="30" rx="4"/>
    <rect x="140" y="260" width="35" height="30" rx="4"/>
    <rect x="190" y="260" width="35" height="30" rx="4"/>
    <rect x="240" y="260" width="35" height="30" rx="4"/>
    <rect x="140" y="310" width="35" height="30" rx="4"/>
    <rect x="240" y="310" width="35" height="30" rx="4"/>
  </g>

  <!-- Door -->
  <rect x="185" y="310" width="40" height="70" rx="5" fill="#1e3a5f"/>
  <circle cx="215" cy="345" r="3" fill="#fde047"/>

  <!-- Parking spot lines -->
  <g stroke="#64748b" stroke-width="3" stroke-dasharray="8,4" fill="none">
    <rect x="310" y="300" width="100" height="80" rx="4"/>
  </g>

  <!-- Car in parking spot -->
  <g transform="translate(315, 310)">
    <!-- Car body -->
    <rect x="5" y="25" width="80" height="30" rx="8" fill="url(#carGrad)"/>
    <!-- Car roof -->
    <path d="M 18 25 L 25 12 L 65 12 L 72 25 Z" fill="#64748b"/>
    <!-- Windows -->
    <path d="M 22 24 L 28 15 L 47 15 L 47 24 Z" fill="#bfdbfe" opacity="0.8"/>
    <path d="M 50 15 L 62 15 L 68 24 L 50 24 Z" fill="#bfdbfe" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="22" cy="56" r="9" fill="#1e293b"/>
    <circle cx="22" cy="56" r="4" fill="#64748b"/>
    <circle cx="68" cy="56" r="9" fill="#1e293b"/>
    <circle cx="68" cy="56" r="4" fill="#64748b"/>
    <!-- Headlight -->
    <circle cx="82" cy="35" r="3" fill="#fde047"/>
  </g>

  <!-- Golden Key -->
  <g transform="translate(70, 180) rotate(-20)">
    <!-- Key bow (head) -->
    <circle cx="30" cy="30" r="22" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="30" cy="30" r="10" fill="#0f172a"/>
    <!-- Key shaft -->
    <rect x="48" y="26" width="55" height="8" rx="2" fill="url(#goldGrad)"/>
    <!-- Key teeth -->
    <rect x="85" y="34" width="8" height="10" fill="url(#goldGrad)"/>
    <rect x="98" y="34" width="6" height="10" fill="url(#goldGrad)"/>
  </g>

  <!-- Cleaner person -->
  <g transform="translate(355, 365)">
    <!-- Body -->
    <rect x="8" y="-30" width="14" height="22" rx="4" fill="#10b981"/>
    <!-- Head -->
    <circle cx="15" cy="-38" r="8" fill="#fbbf24"/>
    <!-- Hat -->
    <path d="M 7 -42 L 23 -42 L 21 -50 L 9 -50 Z" fill="#059669"/>
    <!-- Arms -->
    <rect x="2" y="-26" width="6" height="14" rx="3" fill="#10b981"/>
    <rect x="22" y="-26" width="6" height="14" rx="3" fill="#10b981"/>
    <!-- Mop handle -->
    <rect x="28" y="-45" width="3" height="35" rx="1" fill="#92400e"/>
    <!-- Mop head -->
    <ellipse cx="29.5" cy="-8" rx="7" ry="4" fill="#6b7280"/>
    <!-- Bubbles -->
    <circle cx="0" cy="-15" r="2" fill="#bfdbfe" opacity="0.7"/>
    <circle cx="-4" cy="-22" r="1.5" fill="#bfdbfe" opacity="0.5"/>
    <circle cx="2" cy="-28" r="1" fill="#bfdbfe" opacity="0.6"/>
  </g>
</svg>
